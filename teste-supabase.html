<!DOCTYPE html>
<html>
<head>
    <title>Teste Supabase - WR Aromatizantes</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; margin: 0 auto; }
        .ok { color: green; background: #d1fae5; padding: 15px; border-radius: 8px; }
        .erro { color: red; background: #fee2e2; padding: 15px; border-radius: 8px; }
        pre { background: #f0f0f0; padding: 15px; border-radius: 8px; overflow: auto; max-height: 400px; }
        button { padding: 12px 24px; background: #6d28d9; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px 0; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🔍 Teste de Conexão Supabase</h1>
    
    <button onclick="testar()">▶️ Testar Conexão</button>
    <div id="resultado">Clique no botão para testar...</div>

    <script type="importmap">
    {
        "imports": {
            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
        }
    }
    </script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'https://pgxkklnskkrnajhbazib.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBneGtrbG5za2tybmFqaGJhemliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwODM5NTksImV4cCI6MjEwMDY1OTk1OX0.rVNJ9XQSAXd80HFfZ_93AvZ889aT2-polSUDPI65qP0';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.testar = async function() {
            const resultado = document.getElementById('resultado');
            resultado.innerHTML = '🔄 Testando conexão...';

            try {
                // 1. Testar conexão básica
                const { data: produtos, error: erroProdutos } = await supabase
                    .from('produtos')
                    .select('*')
                    .limit(10);

                let html = '';

                // Verificar erro
                if (erroProdutos) {
                    html += `<div class="erro">❌ Erro ao buscar produtos: ${erroProdutos.message}</div>`;
                    html += `<p><strong>Código do erro:</strong> ${erroProdutos.code || 'N/A'}</p>`;
                    
                    // Sugestões
                    if (erroProdutos.code === 'PGRST301') {
                        html += `<p>🔧 A tabela "produtos" pode não existir. Verifique no Supabase.</p>`;
                    } else if (erroProdutos.code === '42501') {
                        html += `<p>🔧 Erro de permissão (RLS). Verifique as políticas da tabela.</p>`;
                    }
                    
                    resultado.innerHTML = html;
                    return;
                }

                // 2. Verificar se há produtos
                if (!produtos || produtos.length === 0) {
                    html += `<div class="erro">⚠️ Nenhum produto encontrado na tabela "produtos"</div>`;
                    html += `<p>💡 Adicione produtos no Supabase Table Editor ou use o script abaixo.</p>`;
                    resultado.innerHTML = html;
                    return;
                }

                // 3. Mostrar produtos encontrados
                html += `<div class="ok">✅ Conexão OK! ${produtos.length} produto(s) encontrado(s)</div>`;
                
                html += `<h3>📦 Produtos:</h3>`;
                produtos.forEach(p => {
                    html += `<div class="card">
                        <strong>${p.nome || 'Sem nome'}</strong><br>
                        Preço: R$ ${p.preco || 0}<br>
                        Estoque: ${p.saldo || 0}<br>
                        Categoria: ${p.categoria || 'Geral'}<br>
                        ID: ${p.id}
                    </div>`;
                });

                resultado.innerHTML = html;

            } catch (err) {
                resultado.innerHTML = `<div class="erro">❌ Erro: ${err.message}</div>`;
                console.error('Erro detalhado:', err);
            }
        };

        // Testar automaticamente
        setTimeout(() => window.testar(), 500);
    </script>
</body>
</html>
