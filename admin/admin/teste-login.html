<!DOCTYPE html>
<html>
<head>
    <title>Teste de Login</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
        .success { color: green; padding: 10px; background: #d1fae5; border-radius: 8px; }
        .error { color: red; padding: 10px; background: #fee2e2; border-radius: 8px; }
        pre { background: #f0f0f0; padding: 10px; border-radius: 8px; overflow: auto; }
        button { padding: 10px 20px; background: #6d28d9; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #5b21b6; }
        input { padding: 10px; width: 100%; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>🔐 Teste de Login</h1>
    
    <div style="margin-bottom: 20px;">
        <input type="email" id="testEmail" value="admin@wraromatizantes.com" placeholder="Email">
        <input type="password" id="testSenha" value="admin123" placeholder="Senha">
        <button onclick="testarLogin()">Testar Login</button>
    </div>
    
    <div id="resultado"></div>

    <hr style="margin: 30px 0;">

    <h2>Verificar Usuários no Banco</h2>
    <button onclick="verificarUsuarios()">Verificar Usuários</button>
    <div id="usuariosResultado"></div>

    <script type="importmap">
    {
        "imports": {
            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
        }
    }
    </script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        
        const SUPABASE_URL = 'https://pgxkklnskkrnajhbazib.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBneGtrbG5za2tybmFqaGJhemliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwODM5NTksImV4cCI6MjEwMDY1OTk1OX0.rVNJ9XQSAXd80HFfZ_93AvZ889aT2-polSUDPI65qP0';
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        window.testarLogin = async function() {
            const email = document.getElementById('testEmail').value;
            const senha = document.getElementById('testSenha').value;
            const resultado = document.getElementById('resultado');
            
            resultado.innerHTML = '🔍 Testando...';
            
            try {
                // Buscar usuário
                console.log('Buscando usuário:', email);
                const { data: usuario, error } = await supabase
                    .from('usuarios')
                    .select('*')
                    .eq('email', email)
                    .maybeSingle();
                
                if (error) {
                    resultado.innerHTML = `<div class="error">❌ Erro na busca: ${error.message}</div>`;
                    return;
                }
                
                if (!usuario) {
                    resultado.innerHTML = `<div class="error">❌ Usuário não encontrado: ${email}</div>`;
                    return;
                }
                
                console.log('Usuário encontrado:', usuario);
                
                // Verificar senha
                const senhaValida = (senha === usuario.senha_hash) || 
                                   (senha === 'admin123' && usuario.email === 'admin@wraromatizantes.com');
                
                if (!senhaValida) {
                    resultado.innerHTML = `
                        <div class="error">❌ Senha incorreta!</div>
                        <pre>Usuário: ${JSON.stringify(usuario, null, 2)}</pre>
                        <p>Senha digitada: "${senha}"</p>
                        <p>Senha no banco: "${usuario.senha_hash}"</p>
                    `;
                    return;
                }
                
                resultado.innerHTML = `
                    <div class="success">✅ Login bem-sucedido!</div>
                    <pre>Usuário: ${JSON.stringify(usuario, null, 2)}</pre>
                    <p>🔑 Agora acesse: <a href="dashboard.html">Dashboard</a></p>
                `;
                
            } catch (err) {
                resultado.innerHTML = `<div class="error">❌ Erro: ${err.message}</div>`;
            }
        };
        
        window.verificarUsuarios = async function() {
            const resultado = document.getElementById('usuariosResultado');
            resultado.innerHTML = '🔍 Buscando usuários...';
            
            try {
                const { data, error } = await supabase
                    .from('usuarios')
                    .select('*');
                
                if (error) {
                    resultado.innerHTML = `<div class="error">❌ Erro: ${error.message}</div>`;
                    return;
                }
                
                if (!data || data.length === 0) {
                    resultado.innerHTML = '<div class="error">❌ Nenhum usuário encontrado!</div>';
                    return;
                }
                
                resultado.innerHTML = `
                    <div class="success">✅ ${data.length} usuário(s) encontrado(s)</div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
            } catch (err) {
                resultado.innerHTML = `<div class="error">❌ Erro: ${err.message}</div>`;
            }
        };
        
        // Testar automaticamente
        setTimeout(() => {
            window.verificarUsuarios();
        }, 1000);
    </script>
</body>
</html>
